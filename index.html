<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鋼鐵靜態播放器測試</title>
  <!-- 1. 手機 F12 除錯神器 (Eruda) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #121212; color: #fff; }
    iframe { width: 90%; max-width: 560px; height: 315px; border: none; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>YouTube 靜態載入測試</h2>
  <div id="player-container">載入中...</div>

  <script>
    // 動態抓取同目錄下的 data.json
    fetch('./data.json')
      .then(res => res.json())
      .then(data => {
        // 解析 YouTube ID
        const url = new URL(data.youtube_url);
        let videoId = '';
        if (url.hostname.includes('youtu.be')) {
          videoId = url.pathname.slice(1);
        } else {
          videoId = url.searchParams.get('v');
        }

        // 渲染 <iframe> 播放器
        document.getElementById('player-container').innerHTML = `
          <iframe 
            src="https://www.youtube.com/embed/${videoId}" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        `;
      })
      .catch(err => {
        document.getElementById('player-container').innerText = '載入 JSON 失敗';
        console.error(err);
      });
  </script>
</body>
</html>
